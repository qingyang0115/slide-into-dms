name: Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Assemble build
        run: |
          # Every tracked file (so a new top-level file like style.css can't be forgotten), minus dev-only ones.
          mkdir dist
          git archive HEAD | tar -x -C dist
          rm -rf dist/.github dist/CLAUDE.md dist/assets/art/README.md
          # Fail the deploy instead of shipping a broken game.
          test -f dist/index.html && test -f dist/style.css && test -d dist/src && test -d dist/data

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler push dist yang0115/solemate:html5